<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Student Sign In – UENR LibraTrack</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

    html, body {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #E6DAFE 0%, #D8C7FF 50%, #EDE4FF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .login-wrapper {
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      z-index: 10;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Modern Purple Login Panel (Pinterest Left Box) */
    .login-panel {
      max-width: 390px;
      width: 100%;
      max-height: calc(100vh - 32px);
      background: linear-gradient(160deg, #7C22EC 0%, #6105CB 100%);
      border-radius: 32px;
      box-shadow: 0 20px 45px -10px rgba(97, 5, 203, 0.45);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card-content {
      padding: 30px 28px 10px 28px;
      z-index: 2;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-brand img {
      height: 55px;
      margin-bottom: 8px;
      animation: floatLogo 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
        filter: drop-shadow(0 6px 14px rgba(255, 255, 255, 0.4));
      }
    }

    .login-brand h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      color: #FFFFFF;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-brand p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 11px;
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      margin-left: 14px;
    }

    /* Pill-shaped Input Container with icon inside */
    .pill-input-group {
      display: flex;
      align-items: center;
      background: #E2D4F7;
      border-radius: 50px;
      padding: 0 16px;
      height: 46px;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .pill-input-group:focus-within {
      background: #EFE5FD;
      border-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
    }

    .pill-input-group i {
      color: #6C1BD9;
      font-size: 16px;
      margin-right: 10px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .pill-input-group input {
      border: none;
      background: transparent;
      outline: none;
      color: #3B0764;
      font-weight: 600;
      font-size: 13.5px;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .pill-input-group input::placeholder {
      color: #9B72CF;
      font-weight: 400;
    }

    .toggle-password {
      color: #6C1BD9 !important;
      font-size: 16px !important;
      margin-left: auto !important;
      margin-right: 0 !important;
      cursor: pointer;
      padding: 8px;
      transition: all 0.2s ease;
      user-select: none;
      pointer-events: auto;
      position: relative;
      z-index: 10;
    }

    .toggle-password:hover {
      color: #4C1D95 !important;
      transform: scale(1.15);
    }

    /* White Pill Button */
    .btn-submit-pill {
      width: 100%;
      height: 48px;
      border-radius: 50px;
      background: #FFFFFF;
      color: #6C1BD9;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
      background: #F8F5FF;
    }

    .btn-submit-pill:active {
      transform: translateY(0);
    }

    #signup-link-container p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      margin: 0;
    }

    #signup-link-container a {
      color: #FFFFFF;
      text-decoration: underline;
      font-weight: 700;
    }

    /* Alert Box Styling */
    .alert {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      display: none;
      border: 1px solid transparent;
      animation: fadeIn 0.3s ease;
      margin-top: 10px;
    }

    .alert.show {
      display: block;
    }

    .alert-title {
      font-weight: 700;
      margin-bottom: 2px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #FFFFFF;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.4);
      color: #FFFFFF;
    }

    /* Bottom Layered Vector Waves */
    .wave-container {
      width: 100%;
      line-height: 0;
      position: relative;
      z-index: 1;
      margin-bottom: -2px;
      margin-top: 5px;
    }

    .wave-container svg {
      width: 100%;
      height: 85px;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="uenr.png" />
  <link rel="apple-touch-icon" href="uenr.png" />
</head>

<body>

  <div class="login-wrapper">
    <div class="login-panel">
      <div class="card-content">
        <div class="login-brand">
          <img src="uenr.png" alt="UENR Logo" />
          <h2 id="login-title">Student Sign In</h2>
          <p id="login-desc">Sign in with your Student Email and Password</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" id="label-id" for="user-id">STUDENT EMAIL</label>
            <div class="pill-input-group">
              <i class="fa-solid fa-envelope"></i>
              <input id="user-id" type="text" placeholder="e.g. johnterry@gmail.com" autocomplete="username" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" id="label-password" for="user-password">PASSWORD</label>
            <div class="pill-input-group">
              <i class="fa-solid fa-lock"></i>
              <input id="user-password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
              <i class="fa-solid fa-eye toggle-password" id="toggle-password-btn" title="Toggle Password Visibility"></i>
            </div>
          </div>

          <button type="submit" class="btn-submit-pill" id="login-btn">Sign In</button>

          <div id="signup-link-container" style="text-align: center; margin-top: 15px; display: none;">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
          </div>
        </form>

        <div class="alert" id="login-alert">
          <div class="alert-title" id="login-alert-title"></div>
          <div id="login-alert-msg"></div>
        </div>
      </div>

      <!-- Layered Wave Art (Matching Pinterest Left Box) -->
      <div class="wave-container">
        <svg viewBox="0 0 500 150" preserveAspectRatio="none">
          <path d="M0,45 C150,95 350,-5 500,45 L500,150 L0,150 Z" fill="rgba(226, 212, 248, 0.4)"></path>
          <path d="M0,65 C180,115 320,15 500,75 L500,150 L0,150 Z" fill="#EAE0FA"></path>
          <path d="M0,90 C140,45 340,115 500,85 L500,150 L0,150 Z" fill="#FFFFFF"></path>
        </svg>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script>
    const form = document.getElementById('login-form');
    const idInput = document.getElementById('user-id');
    const passInput = document.getElementById('user-password');
    const alertBox = document.getElementById('login-alert');
    const alertTitle = document.getElementById('login-alert-title');
    const alertMsg = document.getElementById('login-alert-msg');

    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role') || 'student';
    const emailParam = urlParams.get('email');
    const createdParam = urlParams.get('created');

    if (roleParam === 'admin') {
      document.getElementById('login-title').textContent = 'Admin Sign In';
      document.getElementById('login-desc').textContent = 'Sign in with your Email and Password';
      document.getElementById('label-id').textContent = 'EMAIL';
      idInput.placeholder = 'Enter your email';
      document.getElementById('label-password').textContent = 'PASSWORD';
      passInput.placeholder = 'Enter Password';
      passInput.removeAttribute('maxlength');
      passInput.removeAttribute('inputmode');
    } else {
      document.getElementById('login-title').textContent = 'Student Sign In';
      document.getElementById('login-desc').textContent = 'Sign in with your Student Email and Password';
      document.getElementById('label-id').textContent = 'STUDENT EMAIL';
      idInput.placeholder = 'e.g. johnterry@gmail.com';
      document.getElementById('label-password').textContent = 'PASSWORD';
      passInput.placeholder = 'Enter your password';
      passInput.removeAttribute('maxlength');
      passInput.removeAttribute('inputmode');
      document.getElementById('signup-link-container').style.display = 'block';
    }

    function showAlert(type, title, msg) {
      alertBox.className = `alert show alert-${type}`;
      alertTitle.innerHTML = title;
      alertMsg.innerHTML = msg;
    }

    if (emailParam) {
      idInput.value = emailParam;
      setTimeout(() => passInput.focus(), 300);
    }

    if (createdParam === 'true') {
      showAlert('success', 'Account Created!', 'Please enter your password to sign in.');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const userId = idInput.value.trim();
      const password = passInput.value.trim();

      if (!userId) {
        showAlert('error', 'Missing ID', 'Please enter your Email');
        return;
      }
      if (!password) {
        showAlert('error', 'Missing Code', 'Please enter your Password or Code');
        return;
      }

      let role = roleParam;
      let name = userId.split('@')[0];

      if (role === 'admin') {
        // Use hardcoded admin login
        if ((userId.toLowerCase() !== 'admin' && !userId.toLowerCase().includes('library@')) || password !== '2011') {
          showAlert('error', 'Authentication Failed', 'Incorrect email or password. Please try again.');
          return;
        }
        name = 'Administrator';
        loginUser(userId, name, role);
        window.location.href = 'admin.html';
      } else {
        const ogText = document.getElementById('login-btn').innerHTML;
        document.getElementById('login-btn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';
        document.getElementById('login-btn').disabled = true;

        // Use Supabase Auth directly
        supabaseClient.auth.signInWithPassword({ email: userId, password: password })
          .then(({ data: authData, error: authError }) => {
            document.getElementById('login-btn').innerHTML = ogText;
            document.getElementById('login-btn').disabled = false;

            if (authError) {
              showAlert('error', 'Login Failed', authError.message || 'Incorrect email or password.');
            } else {
              const fullName = authData.user?.user_metadata?.full_name || name;
              try {
                if (authData?.user) {
                  supabaseClient.from('users').upsert({
                    id: authData.user.id,
                    email: userId,
                    full_name: fullName,
                    role: role,
                    last_login: new Date().toISOString()
                  });
                }
              } catch (syncErr) {
                console.warn('Public table login sync info:', syncErr);
              }
              loginUser(userId, fullName, role);
              window.location.href = 'index.html';
            }
          });
      }
    });

    const togglePassBtn = document.getElementById('toggle-password-btn');
    if (togglePassBtn) {
      togglePassBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const isPassword = passInput.getAttribute('type') === 'password';
        passInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePassBtn.classList.toggle('fa-eye', !isPassword);
        togglePassBtn.classList.toggle('fa-eye-slash', isPassword);
      });
    }
  </script>
</body>

</html>
