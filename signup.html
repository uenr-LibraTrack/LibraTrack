<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Student Sign Up – UENR LibraTrack</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

    html, body {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #E6DAFE 0%, #D8C7FF 50%, #EDE4FF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .login-wrapper {
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      z-index: 10;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Modern White Sign Up Panel (Pinterest Right Box) */
    .login-panel {
      max-width: 390px;
      width: 100%;
      max-height: calc(100vh - 32px);
      background: #FFFFFF;
      border-radius: 32px;
      box-shadow: 0 20px 45px -10px rgba(108, 27, 217, 0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(108, 27, 217, 0.1);
    }

    .card-content {
      padding: 30px 28px 10px 28px;
      z-index: 2;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-brand img {
      height: 55px;
      margin-bottom: 8px;
      animation: floatLogo 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 10px rgba(108, 27, 217, 0.15));
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
        filter: drop-shadow(0 6px 14px rgba(108, 27, 217, 0.3));
      }
    }

    .login-brand h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      color: #6C1BD9;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-brand p {
      color: #7E30E1;
      font-size: 11px;
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      color: #6C1BD9;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
      margin-left: 14px;
    }

    /* Pill-shaped Input Container with icon inside */
    .pill-input-group {
      display: flex;
      align-items: center;
      background: #EFE8FA;
      border-radius: 50px;
      padding: 0 16px;
      height: 46px;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .pill-input-group:focus-within {
      background: #EAE0F8;
      border-color: #6C1BD9;
      box-shadow: 0 0 0 3px rgba(108, 27, 217, 0.15);
    }

    .pill-input-group i {
      color: #6C1BD9;
      font-size: 16px;
      margin-right: 10px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    .pill-input-group input {
      border: none;
      background: transparent;
      outline: none;
      color: #3B0764;
      font-weight: 600;
      font-size: 13.5px;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .pill-input-group input::placeholder {
      color: #9B72CF;
      font-weight: 400;
    }

    /* Vibrant Purple Pill Button */
    .btn-submit-pill {
      width: 100%;
      height: 48px;
      border-radius: 50px;
      background: linear-gradient(135deg, #7C22EC 0%, #6105CB 100%);
      color: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 6px 18px rgba(108, 27, 217, 0.35);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(108, 27, 217, 0.45);
    }

    .btn-submit-pill:active {
      transform: translateY(0);
    }

    #login-link-container p {
      color: #475569;
      font-size: 13px;
      margin: 0;
    }

    #login-link-container a {
      color: #6C1BD9;
      text-decoration: underline;
      font-weight: 700;
    }

    /* Alert Box Styling */
    .alert {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      display: none;
      border: 1px solid transparent;
      animation: fadeIn 0.3s ease;
      margin-top: 10px;
    }

    .alert.show {
      display: block;
    }

    .alert-title {
      font-weight: 700;
      margin-bottom: 2px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #b91c1c;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.3);
      color: #15803d;
    }

    /* Compact Success Screen Styling */
    .success-card {
      text-align: center;
      padding: 5px 0;
      animation: fadeIn 0.4s ease-in-out;
    }

    .success-img-wrapper {
      margin: 0 auto 12px auto;
      max-width: 140px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(108, 27, 217, 0.2);
      border: 2px solid rgba(108, 27, 217, 0.15);
    }

    .success-img-wrapper img {
      width: 100%;
      height: 100px;
      display: block;
      object-fit: cover;
    }

    /* Bottom Layered Vector Waves (Purple gradient theme for Right Box) */
    .wave-container {
      width: 100%;
      line-height: 0;
      position: relative;
      z-index: 1;
      margin-bottom: -2px;
      margin-top: 5px;
    }

    .wave-container svg {
      width: 100%;
      height: 85px;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="uenr.png" />
  <link rel="apple-touch-icon" href="uenr.png" />
</head>

<body>

  <div class="login-wrapper">
    <div class="login-panel">
      <div class="card-content">
        <div id="signup-initial-view">
          <div class="login-brand">
            <img src="uenr.png" alt="UENR Logo" />
            <h2>Student Sign Up</h2>
            <p>Create a new student account</p>
          </div>

          <form id="signup-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="user-name">FULL NAME</label>
              <div class="pill-input-group">
                <i class="fa-solid fa-user"></i>
                <input id="user-name" type="text" placeholder="e.g. John Terry" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="user-id">EMAIL</label>
              <div class="pill-input-group">
                <i class="fa-solid fa-envelope"></i>
                <input id="user-id" type="text" placeholder="e.g. johnterry@gmail.com" autocomplete="username" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="user-password">PASSWORD</label>
              <div class="pill-input-group">
                <i class="fa-solid fa-lock"></i>
                <input id="user-password" type="password" placeholder="Create a password" autocomplete="new-password" required />
              </div>
            </div>

            <button type="submit" class="btn-submit-pill" id="signup-btn">Create Account</button>

            <div id="login-link-container" style="text-align: center; margin-top: 15px;">
              <p>Already have an account? <a href="login.html?role=student">Sign In</a></p>
            </div>
          </form>

          <div class="alert" id="signup-alert">
            <div class="alert-title" id="signup-alert-title"></div>
            <div id="signup-alert-msg"></div>
          </div>
        </div>

        <!-- Compact Account Created Success Display -->
        <div id="signup-success-view" class="success-card" style="display: none;">
          <div class="success-img-wrapper">
            <img src="Account success created.jfif" alt="Account Successfully Created" />
          </div>
          <div class="login-brand" style="margin-bottom: 8px;">
            <h2 style="color: #16a34a; font-size: 20px;">Account Created!</h2>
            <p id="success-welcome-msg" style="color: #3B0764; margin-top: 4px; font-weight: 600; font-size: 12.5px;">
              Your account is ready.
            </p>
          </div>
          <p style="color: #64748b; font-size: 12.5px; margin-bottom: 12px; line-height: 1.4;">
            Click <strong>Continue</strong> to sign in.
          </p>
          <button type="button" class="btn-submit-pill" id="continue-btn" style="height: 44px; font-size: 14px;">
            <span>Continue</span> <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i>
          </button>
        </div>

      </div>

      <!-- Layered Wave Art (Matching Pinterest Right Box) -->
      <div class="wave-container">
        <svg viewBox="0 0 500 150" preserveAspectRatio="none">
          <path d="M0,45 C150,95 350,-5 500,45 L500,150 L0,150 Z" fill="#D8C2F8"></path>
          <path d="M0,65 C180,115 320,15 500,75 L500,150 L0,150 Z" fill="#9B51E0"></path>
          <path d="M0,90 C140,45 340,115 500,85 L500,150 L0,150 Z" fill="#6105CB"></path>
        </svg>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script>
    const form = document.getElementById('signup-form');
    const nameInput = document.getElementById('user-name');
    const idInput = document.getElementById('user-id');
    const passInput = document.getElementById('user-password');
    const alertBox = document.getElementById('signup-alert');
    const alertTitle = document.getElementById('signup-alert-title');
    const alertMsg = document.getElementById('signup-alert-msg');
    const signupBtn = document.getElementById('signup-btn');

    function showAlert(type, title, msg) {
      alertBox.className = `alert show alert-${type}`;
      alertTitle.innerHTML = title;
      alertMsg.innerHTML = msg;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const email = idInput.value.trim();
      const password = passInput.value.trim();

      if (!name) { showAlert('error', 'Missing Name', 'Please enter your Full Name'); return; }
      if (!email) { showAlert('error', 'Missing Email', 'Please enter your Student Email'); return; }
      if (!password) { showAlert('error', 'Missing Password', 'Please create a Password or Code'); return; }

      const ogText = signupBtn.innerHTML;
      signupBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';
      signupBtn.disabled = true;

      // Use Supabase Auth
      supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: { data: { full_name: name } }
      }).then(({ data: authData, error: authError }) => {
        signupBtn.innerHTML = ogText;
        signupBtn.disabled = false;

        if (authError) {
          showAlert('error', 'Sign Up Failed', authError.message);
        } else {
          // Hide registration form view
          document.getElementById('signup-initial-view').style.display = 'none';

          // Update welcome message
          document.getElementById('success-welcome-msg').innerHTML = `Welcome, <strong>${name}</strong>!`;

          // Display success view with image
          const successView = document.getElementById('signup-success-view');
          successView.style.display = 'block';

          // Activate Continue button to allow user to enter credentials
          const continueBtn = document.getElementById('continue-btn');
          continueBtn.onclick = () => {
            window.location.href = `login.html?role=student&email=${encodeURIComponent(email)}&created=true`;
          };
        }
      });
    });
  </script>
</body>

</html>
